<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pencil resident · rig review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#c3c2b7;font:14px system-ui}header{padding:20px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid #333}button,select,input{font:inherit;color:inherit;background:#20201e;border:1px solid #555;border-radius:5px;padding:7px}label{display:flex;align-items:center;gap:7px}main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(280px,430px);min-height:700px}.stage{position:relative;min-height:620px;overflow:hidden;background:radial-gradient(#242422 1px,transparent 1px) 0 0/30px 30px}.scene{position:absolute;width:120px;height:200px;left:calc(50% - 60px);top:calc(50% - 100px);transform:scale(.65);transform-origin:center bottom}.scene>div{position:absolute;inset:0}.figure{pointer-events:none}.figure .resident-hit{cursor:grab}.figure.dragging .resident-hit{cursor:grabbing}.floor{position:absolute;left:-120px;top:190px;width:340px;border-top:1px solid #393936}.card{position:absolute;top:10px;left:-140px;width:202px;height:190px;background:#181817;border:1px solid #393936;border-radius:8px;display:none}.aside{padding:24px;max-height:740px;overflow:auto}pre{font:11px/1.4 monospace;white-space:pre-wrap}.hint{position:absolute;left:20px;bottom:16px;color:#73736d;font-size:12px}h1{font-size:16px;margin-top:0}input[type=range]{width:110px}#status{width:100%;color:#97978e}@media(max-width:760px){main{display:block}.stage{min-height:420px}.aside{max-height:320px}}
</style>
<header><label>Scene <select id="action"></select></label><label>Variant <input id="variant" type="number" value="0" min="0" max="12" style="width:62px"></label><button id="run">Run / repeat</button><button id="pause">Pause</button><button id="interrupt">Pick up → land</button><label>Speed <input id="speed" type="range" min="0.2" max="2" value="1" step="0.1"></label><label>Scale <input id="scale" type="range" min=".5" max="2" value=".65" step=".05"></label><label><input id="debug" type="checkbox"> Contacts</label><label><input id="reduce" type="checkbox"> Reduced motion</label><div id="status"></div></header>
<main><div class="stage"><div class="scene"><div class="card"></div><div class="floor"></div><div class="fixtures"></div><div class="figure"></div></div><div class="hint">Developer-only viewer. Actual interface size starts at 130px.</div></div><aside class="aside"><h1>One geometry, fixed segment lengths</h1><p>Seat and floor contacts, hand props, interruption and phase state are exposed below. Drag the figure to verify the furniture remains anchored.</p><pre id="metrics"></pre></aside></main>
<script src="../../../site/studio-character-rig.js"></script>
<script>
const $=s=>document.querySelector(s),rig=StudioCharacterRig.create($('.figure'),{fixtureHost:$('.fixtures')});
StudioCharacterRig.actions.forEach(a=>$('#action').add(new Option(a,a)));
let frame=0,last=0,elapsed=0,paused=false,phaseIndex=0,sceneToken=0,drag=null,held=null;
const phases=['prepare','perform','finish'],duration=[1300,6500,1500];
function draw(){const action=$('#action').value,phase=phases[phaseIndex];rig.render({action,phase,progress:Math.min(1,elapsed/duration[phaseIndex]),elapsed,variant:+$('#variant').value,held,debug:$('#debug').checked,sceneId:sceneToken});$('.card').style.display=action==='peek'?'block':'none';rig.bodyElement.style.clipPath=action==='peek'?'polygon(62px -100px,300px -100px,300px 250px,62px 250px)':'';$('#status').textContent=`${action} · ${phase} · ${(elapsed/duration[phaseIndex]).toFixed(2)}${paused?' · paused':''}`;$('#metrics').textContent=JSON.stringify(rig.metrics(),null,2);}
function tick(now){frame=0;if(paused||$('#reduce').checked||drag)return;elapsed+=Math.min(60,now-last)*(+$('#speed').value);last=now;if(elapsed>=duration[phaseIndex]){elapsed=0;phaseIndex++;if(phaseIndex>2){phaseIndex=2;elapsed=duration[2];draw();return;}}draw();frame=requestAnimationFrame(tick);}
function run(){cancelAnimationFrame(frame);elapsed=0;phaseIndex=0;sceneToken++;paused=false;held=null;$('#pause').textContent='Pause';if($('#reduce').checked){rig.render({action:'idle',phase:'perform',progress:0,debug:$('#debug').checked});return;}last=performance.now();draw();frame=requestAnimationFrame(tick);}
$('#run').onclick=run;$('#action').onchange=run;$('#variant').onchange=run;$('#debug').onchange=draw;$('#scale').oninput=()=>$('.scene').style.transform=`scale(${$('#scale').value})`;
$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Resume':'Pause';if(paused){cancelAnimationFrame(frame);frame=0;}else{last=performance.now();frame=requestAnimationFrame(tick);}draw();};
$('#reduce').onchange=run;
$('#interrupt').onclick=()=>{held=rig.metrics().handProp?.kind||null;cancelAnimationFrame(frame);$('#action').value='lift';phaseIndex=1;elapsed=0;draw();setTimeout(()=>{if($('#action').value!=='lift')return;$('#action').value='land';elapsed=0;last=performance.now();duration[1]=850;frame=requestAnimationFrame(tick);},900);};
$('.figure').onpointerdown=e=>{if(!e.target.closest('.resident-hit'))return;cancelAnimationFrame(frame);held=rig.metrics().handProp?.kind||null;drag={x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.classList.add('dragging');rig.render({action:'lift',phase:'perform',progress:0,held});};
$('.figure').onpointermove=e=>{if(!drag)return;const s=+$('#scale').value;$('.figure').style.transform=`translate(${(e.clientX-drag.x)/s}px,${(e.clientY-drag.y)/s}px)`;};
$('.figure').onpointerup=e=>{if(!drag)return;drag=null;$('.figure').classList.remove('dragging');$('.figure').style.transform='';$('#action').value='land';phaseIndex=1;elapsed=0;duration[1]=850;last=performance.now();frame=requestAnimationFrame(tick);};
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;paused=true;$('#pause').textContent='Resume';}});draw();
</script></html>
